ShortDescription: A minimal, clipboard-first OpenPGP app for Windows.
Description: A minimal, modern OpenPGP app for Windows - clipboard-first, with no UI bloat. Paste a message to decrypt and verify it, or type plaintext to encrypt it for your recipients. Keys live as human-readable armored files under %LOCALAPPDATA%, private keys are passphrase-encrypted at rest, and all cryptography runs in the embedded Rust engine (rPGP) with no JS crypto. Interop-tested against GnuPG.
