[package]
name = "pocketpgp"
version = "0.1.0"
description = "A minimal, modern, fully-offline OpenPGP app for Windows"
authors = ["PocketPGP contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = ""
default-run = "pocketpgp"

[lib]
name = "pocketpgp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"

# --- OpenPGP engine: rPGP, the single source of crypto truth ---
pgp = "0.21.1"
rsa = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
smallvec = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
