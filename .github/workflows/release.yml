# Release: builds the NSIS installer + portable exe for a pushed v* tag and
# attaches both to the GitHub release (creating it if needed).
#
# Manual dispatch (workflow_dispatch) builds without touching releases -
# useful as a full-build smoke test.
#
# Local equivalent of the artifacts: powershell -File scripts\build-release.ps1

name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases, upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Builds the app with the bundle config (NSIS, per-user install) and,
      # when triggered by a tag, creates/updates the GitHub release, attaches
      # the installer, signs it with the TAURI_SIGNING_* secrets, and
      # uploads the latest.json updater manifest. On manual dispatch (empty
      # tagName) it only builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "PGPBench ${{ github.ref_name }}"
          releaseBody: "See the assets below to download this version.

The installer (x64-setup.exe) is per-user - no admin prompt, Start-menu
entries plus uninstaller. The portable build is a single exe that runs from
anywhere; it needs the WebView2 Runtime (preinstalled on current Windows
10/11). PGPBench performs no network calls except the optional,
signature-verified update check."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # tauri-action attaches the NSIS bundle; add the portable exe so both
      # download options exist on every release.
      - name: Attach portable build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "PGPBench-$version-win64-portable.zip"
          Compress-Archive -Path "src-tauri/target/release/pgpbench.exe" -DestinationPath $zip
          gh release upload ${{ github.ref_name }} $zip --clobber
